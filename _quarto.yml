project:
  type: website
  resources:
    - "team/**/*.pdf"

website:
  title: "CALM LAB"
  favicon: /images/lablogo.png
  site-url: https://calmlab.science
  page-navigation: true
  back-to-top-navigation: false
  twitter-card: true
  open-graph: true
  image: /images/share_preview.png
  search: false

  navbar:
    pinned: true
    right:
      - href: team/index.qmd
        text: Team
      - href: research.qmd
        text: Research
      - href: publications/index.qmd
        text: Publications
      - href: news/index.qmd
        text: News
      - href: contact.qmd
        text: Contact

format:
  html:
    # The site currently contains no TeX math. Keep formulas as plain spans
    # so Quarto does not add MathJax and its polyfill to every page.
    html-math-method: plain
    theme:
      - cosmo
    mainfont: "Source Sans 3"
    css:
      - assets/style.css
    include-after-body:
      - assets/scripts.html
      - assets/footer.html
    anchor-sections: false
