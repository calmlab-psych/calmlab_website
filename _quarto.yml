project:
  type: website
  resources:
    - "team/**/*.pdf"

website:
  title: "CALM LAB"
  favicon: images/lablogo.png
  site-url: https://jasontsukahara.com
  page-navigation: true
  back-to-top-navigation: false
  twitter-card:
    image: images/share_preview.png
  open-graph:
    image: images/share_preview.png
  search: false

  navbar:
    pinned: true
    right:
      - href: team/index.qmd
        text: Team
      - href: research.qmd
        text: Research
      - href: publications/index.qmd
        text: Publications
      - href: news/index.qmd
        text: News
      - href: contact.qmd
        text: Contact

format:
  html:
    theme:
      - cosmo
    mainfont: "Source Sans 3"
    css:
      - assets/style.css
    include-after-body:
      - assets/scripts.html
      - assets/footer.html
    include-in-header: assets/academicons.html
    anchor-sections: false
